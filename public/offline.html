<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>You're offline · Mad Buddy</title>
<!--
  The offline shell (MB-GOD-041).

  Served by the service worker ONLY when a navigation cannot reach the network.
  Before this existed, a tap on any in-app link while offline produced Chrome's
  own error page (chrome-error://chromewebdata/) -- outside the app entirely,
  and in an installed PWA there is no address bar, so the user was stranded.

  WHAT THIS DELIBERATELY IS NOT: it carries no user data of any kind, and the
  worker caches none to build it. sw.js states that it "stores no page or user
  data", and that is a privacy stance rather than an oversight -- a cached
  Muddy list or conversation would sit in the browser's cache after sign-out,
  readable by anyone with the device. So this page is static, self-contained,
  and identical for every user: brand, an explanation, and a way back.

  Self-contained by necessity: an external stylesheet or font could not be
  fetched in the situation this page exists to handle.
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: hsl(41 71% 98%);
    --fg: hsl(3 25% 12%);
    --muted: hsl(3 12% 40%);
    --card: hsl(0 0% 100%);
    --border: hsl(3 15% 88%);
    --brand: #e88c2b;
    --brand-ink: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: hsl(8 18% 8%);
      --fg: hsl(38 30% 96%);
      --muted: hsl(38 12% 70%);
      --card: hsl(8 15% 12%);
      --border: hsl(8 12% 24%);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: calc(env(safe-area-inset-top, 0px) + 1.5rem) 1.25rem
             calc(env(safe-area-inset-bottom, 0px) + 1.5rem);
    background: var(--bg);
    color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%;
    max-width: 26rem;
    text-align: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 1.35rem;
    padding: 2rem 1.5rem;
  }
  .mark {
    width: 3.25rem; height: 3.25rem;
    margin: 0 auto 1.25rem;
    display: grid; place-items: center;
    border-radius: 999px;
    background: rgb(232 140 43 / 0.14);
    color: var(--brand);
  }
  h1 { margin: 0; font-size: 1.375rem; letter-spacing: -0.01em; }
  p { margin: 0.75rem 0 0; font-size: 0.9375rem; line-height: 1.6; color: var(--muted); }
  .actions { margin-top: 1.75rem; display: grid; gap: 0.625rem; }
  button, a.btn {
    /* 44px minimum, the same rule the rest of the product now follows. */
    min-height: 2.75rem;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0.625rem 1.25rem;
    border-radius: 999px;
    font: inherit; font-size: 0.9375rem; font-weight: 600;
    cursor: pointer; text-decoration: none;
    border: 1px solid transparent;
  }
  button { background: var(--brand); color: var(--brand-ink); }
  a.btn { background: transparent; color: var(--fg); border-color: var(--border); }
  button:focus-visible, a.btn:focus-visible {
    outline: 2px solid var(--brand); outline-offset: 2px;
  }
  .status { margin-top: 1.25rem; font-size: 0.8125rem; color: var(--muted); min-height: 1.2em; }
</style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 8.82a15 15 0 0 1 20 0" /><path d="M5 12.859a10 10 0 0 1 14 0" />
        <path d="M8.5 16.429a5 5 0 0 1 7 0" /><line x1="2" y1="2" x2="22" y2="22" />
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>
      Mad Buddy needs a connection to load this. Nothing you've done has been
      lost — reconnect and pick up where you left off.
    </p>
    <div class="actions">
      <button type="button" id="retry">Try again</button>
      <a class="btn" href="/dashboard">Go to Home</a>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>
<script src="/offline.js"></script>
</body>
</html>
