<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" fill="none">
  <!--
    Mad Buddy "proximity ambience" wallpaper. Used as a single non-repeating
    CSS mask (only the alpha channel matters) — the app paints these shapes in
    a theme token at a very low opacity, so it reads as atmosphere, not an
    illustration. No feature/people/chat icons, no tiles. Elements are sparse
    and asymmetric: faint irregular proximity rings, tiny scattered particles,
    soft signal waves, and abstract fragments of the M/B letterforms.
  -->
  <g fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round">
    <!-- Proximity ring clusters (irregular, concentric) -->
    <g opacity="0.9"><circle cx="250" cy="300" r="52"/></g>
    <g opacity="0.5"><circle cx="250" cy="300" r="92"/></g>
    <g opacity="0.28"><circle cx="250" cy="300" r="140"/></g>

    <g opacity="0.7"><circle cx="770" cy="700" r="44"/></g>
    <g opacity="0.36"><circle cx="770" cy="700" r="84"/></g>

    <!-- A partial / broken ring (arc) for irregularity -->
    <path d="M600 140 a70 70 0 0 1 66 96" opacity="0.32"/>
    <circle cx="628" cy="176" r="30" opacity="0.55"/>

    <!-- Soft, wide signal waves drifting across -->
    <path d="M-40 560 C 200 500 360 640 560 590 S 900 500 1060 570" opacity="0.22"/>
    <path d="M-40 840 C 220 790 380 900 600 850 S 940 780 1060 830" opacity="0.16"/>

    <!-- Abstract M/B letterform fragments (geometry, not a logo) -->
    <path d="M120 760 L152 690 L184 760 L216 690 L248 760" opacity="0.24"/>
    <path d="M840 250 L840 360 M840 258 a26 22 0 0 1 0 52 M840 306 a30 26 0 0 1 0 54" opacity="0.2"/>
  </g>

  <!-- Tiny scattered particles -->
  <g fill="#000" stroke="none">
    <circle cx="150" cy="150" r="2.4" opacity="0.5"/>
    <circle cx="430" cy="220" r="1.8" opacity="0.4"/>
    <circle cx="360" cy="470" r="2.6" opacity="0.45"/>
    <circle cx="520" cy="360" r="1.6" opacity="0.35"/>
    <circle cx="700" cy="180" r="2.2" opacity="0.4"/>
    <circle cx="900" cy="430" r="2.8" opacity="0.5"/>
    <circle cx="640" cy="560" r="1.7" opacity="0.32"/>
    <circle cx="180" cy="520" r="1.9" opacity="0.4"/>
    <circle cx="470" cy="720" r="2.5" opacity="0.42"/>
    <circle cx="880" cy="820" r="2" opacity="0.4"/>
    <circle cx="300" cy="880" r="1.7" opacity="0.34"/>
    <circle cx="720" cy="930" r="2.3" opacity="0.4"/>
    <circle cx="60" cy="700" r="1.6" opacity="0.3"/>
    <circle cx="960" cy="640" r="1.8" opacity="0.36"/>
  </g>
</svg>
