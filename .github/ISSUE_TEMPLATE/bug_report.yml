name: Bug report
description: Report a reproducible defect in Mad Buddy
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include passwords, tokens, private user data or security vulnerabilities here. Use SECURITY.md for security reports.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: surface
    attributes:
      label: Surface
      description: Web, PWA, Android, iOS, admin, API, etc.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots, logs or error text with secrets/private data removed.
