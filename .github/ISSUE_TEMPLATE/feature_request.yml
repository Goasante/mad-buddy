name: Feature request
description: Propose a focused product or developer-experience improvement
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or developer problem should this solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result rather than prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy / safety considerations
      description: Note any impact on location, identity, relationships, messaging, Safe Arrival or billing.
