name: One-shot profile UI cleanup

on:
  push:
    branches: [ui-profile-cleanup-20260922]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-profile-cleanup-20260922
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply focused UI cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old[:80]!r}")
              p.write_text(text.replace(old, new, count))

          # Access is the ad-free entitlement, not a Linkr/UpFor paywall.
          replace(
              "components/dashboard/quick-controls-sheet.tsx",
              'description="Linkr and UpFor access"',
              'description="Remove ads across Mad Buddy"'
          )
          replace(
              "mobile/src/screens/MoreScreen.tsx",
              'description: "Linkr and UpFor expansion"',
              'description: "Ad-free Mad Buddy"'
          )
          replace(
              "lib/access/paystack.ts",
              '"Your Mad Buddy Access is active. Linkr and UpFor are unlocked."',
              '"Your Mad Buddy Access is active. Mad Buddy is now ad-free."'
          )

          # Onboarding: keep the same data, but remove vertical sprawl.
          replace(
              "components/onboarding/onboarding-flow.tsx",
              'description: "Add a little personality now, or come back to it later."',
              'description: "Add a few optional details, or finish now."'
          )
          replace(
              "components/onboarding/onboarding-flow.tsx",
              'className="mt-5 rounded-2xl border border-border/70 bg-card p-5 shadow-sm sm:p-7"',
              'className="mt-5 rounded-2xl border border-border/70 bg-card p-4 shadow-sm sm:p-6"'
          )
          replace(
              "components/onboarding/onboarding-flow.tsx",
              '<div className="mt-6 space-y-6">',
              '<div className="mt-5 space-y-5">'
          )
          replace(
              "components/onboarding/onboarding-flow.tsx",
              'rows={3}\n                  placeholder="A little about you"',
              'rows={2}\n                  placeholder="A little about you"'
          )
          replace(
              "components/onboarding/onboarding-flow.tsx",
              'hint="Optional and private by default."',
              'hint="Optional now. Private by default; Linkr needs it."'
          )
          replace(
              "components/onboarding/onboarding-flow.tsx",
              '''                <p className="mt-2 text-xs leading-5 text-muted-foreground">\n                  Used for birthday celebrations, age display, and zodiac. You control what approved Muddies can see.\n                </p>\n''',
              ''
          )
          replace(
              "components/onboarding/onboarding-flow.tsx",
              '''              <div className="space-y-2.5">\n                <div>\n                  <p className="text-sm font-medium">Mood</p>\n                  <p className="mt-1 text-xs text-muted-foreground">Optional. You can change this anytime.</p>\n                </div>\n                <MoodStatusSelector value={moodStatus} onChange={setMoodStatus} />\n              </div>''',
              '''              <div className="space-y-2">\n                <div className="flex items-center justify-between gap-3">\n                  <p className="text-sm font-medium">Mood</p>\n                  <p className="text-xs text-muted-foreground">Optional</p>\n                </div>\n                <MoodStatusSelector value={moodStatus} onChange={setMoodStatus} />\n              </div>'''
          )
          replace(
              "components/onboarding/onboarding-flow.tsx",
              '''              <div className="rounded-xl bg-secondary/60 p-3 text-xs leading-5 text-muted-foreground">\n                You can add a photo and more details from Profile after setup. Your visibility starts off.\n              </div>''',
              '''              <div className="rounded-xl bg-secondary/60 px-3 py-2.5 text-xs leading-5 text-muted-foreground">\n                Photo and more details can be added later. Visibility starts off.\n              </div>'''
          )

          replace(
              "components/onboarding/mood-status-selector.tsx",
              '{ value: "open", label: "Open", description: "Ready to be seen by friends." },',
              '{ value: "open", label: "Open", description: "Ready to connect." },'
          )
          replace(
              "components/onboarding/mood-status-selector.tsx",
              '{ value: "busy", label: "Busy", description: "Around, but keeping it low-key." },',
              '{ value: "busy", label: "Busy", description: "Keeping it low-key." },'
          )
          replace(
              "components/onboarding/mood-status-selector.tsx",
              '{ value: "exploring", label: "Exploring", description: "Out and open to plans." },',
              '{ value: "exploring", label: "Exploring", description: "Open to plans." },'
          )
          replace(
              "components/onboarding/mood-status-selector.tsx",
              '{ value: "quiet", label: "Quiet", description: "Soft glow, fewer prompts." }',
              '{ value: "quiet", label: "Quiet", description: "Fewer prompts." }'
          )
          replace(
              "components/onboarding/mood-status-selector.tsx",
              'className="grid gap-3 sm:grid-cols-2"',
              'className="grid grid-cols-2 gap-2"'
          )
          replace(
              "components/onboarding/mood-status-selector.tsx",
              '"focus-ring safe-motion rounded-lg border p-4 text-left",',
              '"focus-ring safe-motion rounded-xl border p-3 text-left",'
          )
          replace(
              "components/onboarding/mood-status-selector.tsx",
              '<span className="mt-1 block text-xs leading-5 text-muted-foreground">',
              '<span className="mt-1 block text-[0.6875rem] leading-4 text-muted-foreground">'
          )

          # Profile: compact the identity handoff without changing profile/privacy rules.
          replace(
              "components/profile/profile-page.tsx",
              '''  const avatarField = (\n''',
              '''  const identityHandoffCopy =\n    !savedProfile.dateOfBirth && !avatarUrl\n      ? "Add your date of birth and profile photo, then head back."\n      : !savedProfile.dateOfBirth\n        ? "Add your date of birth, then head back."\n        : !avatarUrl\n          ? "Add a profile photo, then head back."\n          : "Your Linkr profile is ready. Head back when you're done.";\n\n  const avatarField = (\n'''
          )
          replace(
              "components/profile/profile-page.tsx",
              '''            {section === "identity"\n              ? "Add your date of birth and photo, then head back."\n              : "Finish here, then head back."}''',
              '''            {section === "identity" ? identityHandoffCopy : "Finish here, then head back."}'''
          )
          replace(
              "components/profile/profile-page.tsx",
              '<Card className="p-5 sm:p-6">',
              '<Card className="p-4 sm:p-6">'
          )
          replace(
              "components/profile/profile-page.tsx",
              '<div className="grid gap-4">',
              '<div className="grid gap-3 sm:gap-4">',
              count=1
          )
          replace(
              "components/profile/profile-page.tsx",
              '''            <ProfilePhotoCarousel\n              photos={photos}\n              isOwner\n              avatarUrl={avatarUrl ? avatarSrc : null}\n              onChanged={() => router.refresh()}\n            />''',
              '''            {section === "identity" && returnTo ? null : (\n              <ProfilePhotoCarousel\n                photos={photos}\n                isOwner\n                avatarUrl={avatarUrl ? avatarSrc : null}\n                onChanged={() => router.refresh()}\n              />\n            )}'''
          )
          replace(
              "components/profile/profile-page.tsx",
              '<TrustedMemberApplyCard standing={trustedStanding} trustedSince={trustedSince} />',
              '{section === "identity" && returnTo ? null : (\n              <TrustedMemberApplyCard standing={trustedStanding} trustedSince={trustedSince} />\n            )}',
              count=1
          )
          replace(
              "components/profile/profile-page.tsx",
              '<Textarea id="bio" value={bio} maxLength={160} placeholder="Share a little about yourself" onChange={(event) => setBio(event.target.value)} />',
              '<Textarea id="bio" value={bio} maxLength={160} rows={3} className="min-h-24" placeholder="Share a little about yourself" onChange={(event) => setBio(event.target.value)} />'
          )
          replace(
              "components/profile/profile-page.tsx",
              '''                <div className="rounded-xl border border-border/70 bg-secondary/25 px-4 py-3">\n                  <p className="text-sm font-medium">{savedProfile.dateOfBirth}</p>\n                  {dateOfBirthCanCorrect ? (\n                    <Button type="button" size="sm" variant="ghost" className="mt-2" onClick={() => setCorrectingDateOfBirth(true)}>\n                      Correct date of birth\n                    </Button>\n                  ) : (\n                    <p className="mt-2 text-xs leading-5 text-muted-foreground">\n                      Your self-serve correction has been used. <Link href="/help">Contact support</Link> to request another change.\n                    </p>\n                  )}\n                </div>\n              )}\n              <p className="mt-2 text-xs leading-5 text-muted-foreground">\n                Age, zodiac, and birthday status are calculated automatically. You choose what Muddies can see.\n              </p>''',
              '''                <div className="rounded-xl border border-border/70 bg-secondary/25 px-3 py-2.5">\n                  <div className="flex items-center justify-between gap-3">\n                    <p className="text-sm font-medium">{savedProfile.dateOfBirth}</p>\n                    {dateOfBirthCanCorrect ? (\n                      <Button type="button" size="sm" variant="ghost" className="h-8 shrink-0 px-3" onClick={() => setCorrectingDateOfBirth(true)}>\n                        Correct\n                      </Button>\n                    ) : null}\n                  </div>\n                  {!dateOfBirthCanCorrect ? (\n                    <p className="mt-1.5 text-xs leading-5 text-muted-foreground">\n                      Your self-serve correction has been used. <Link href="/help">Contact support</Link> to request another change.\n                    </p>\n                  ) : null}\n                </div>\n              )}\n              <p className="mt-1.5 text-xs leading-5 text-muted-foreground">\n                Age, birthday and zodiac are calculated automatically.\n              </p>'''
          )
          replace(
              "components/profile/profile-page.tsx",
              '<div className="grid gap-3 rounded-xl border border-border/70 bg-secondary/25 p-4 sm:grid-cols-3">',
              '<div className="grid grid-cols-3 gap-2 rounded-xl border border-border/70 bg-secondary/25 p-3">'
          )
          replace(
              "components/profile/profile-page.tsx",
              'label="Show birthday"\n                  size="compact"',
              'label="Birthday"\n                  size="compact"\n                  className="min-w-0"\n                  triggerClassName="px-2"'
          )
          replace(
              "components/profile/profile-page.tsx",
              'label="Show age"\n                  size="compact"',
              'label="Age"\n                  size="compact"\n                  className="min-w-0"\n                  triggerClassName="px-2"'
          )
          replace(
              "components/profile/profile-page.tsx",
              'label="Show zodiac"\n                  size="compact"',
              'label="Zodiac"\n                  size="compact"\n                  className="min-w-0"\n                  triggerClassName="px-2"'
          )
          replace(
              "components/profile/profile-page.tsx",
              '<div className="flex flex-wrap justify-end gap-2 border-t border-border/70 pt-4">',
              '<div className="flex flex-wrap justify-end gap-2 border-t border-border/70 pt-3">'
          )
          PY

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Mobile type check
        working-directory: mobile
        run: |
          npm ci
          npm run typecheck

      - name: Commit cleanup
        shell: bash
        run: |
          rm .github/workflows/ui-profile-cleanup-once.yml
          git config user.name "Goasante"
          git config user.email "godfredasante004@gmail.com"
          git add components/dashboard/quick-controls-sheet.tsx components/onboarding/onboarding-flow.tsx components/onboarding/mood-status-selector.tsx components/profile/profile-page.tsx lib/access/paystack.ts mobile/src/screens/MoreScreen.tsx .github/workflows/ui-profile-cleanup-once.yml
          git commit -m "Polish onboarding and profile setup UI"
          git push origin HEAD:ui-profile-cleanup-20260922
