name: Linkr final UX review

on:
  push:
    paths:
      - ".github/workflows/linkr-final-ux-review.yml"
      - ".github/scripts/linkr-final-ux-review.py"

permissions:
  contents: write

jobs:
  review-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final Linkr UX fixes
        run: python3 .github/scripts/linkr-final-ux-review.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Run Linkr regression suite
        run: npx vitest run lib/linkr/final-architecture-review.test.ts lib/linkr/connect-block-guard.test.ts lib/linkr/connect-race-migration.test.ts lib/linkr/conversation-ownership.test.ts lib/linkr/relationship-state.test.ts lib/linkr/intent.test.ts

      - name: Commit reviewed UX
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/linkr-final-ux-review.yml .github/scripts/linkr-final-ux-review.py
          git config user.name "Mad Buddy Architecture Review"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Linkr rewind and support UX"
          git push origin HEAD:main
