name: Apply messaging architecture closeout

on:
  push:
    branches: [fix/messaging-architecture-closeout]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/messaging-architecture-closeout
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply targeted messaging fixes
        run: python3 scripts/apply-messaging-architecture-closeout.py

      - name: Install dependencies
        run: npm ci

      - name: Diff check
        run: git diff --check

      - name: Messaging closeout tests
        run: npx vitest run lib/messaging/messaging-architecture-closeout.test.ts lib/messaging/optimistic-messages.test.ts lib/messaging/thread-cache.test.ts lib/messaging/thread-store.test.ts lib/messaging/warm-thread-open.test.ts

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Full tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee full-test.log

      - name: Upload full-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-log
          path: full-test.log
          if-no-files-found: warn

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Commit verified changes
        shell: bash
        run: |
          git rm .github/workflows/apply-messaging-architecture-closeout.yml scripts/apply-messaging-architecture-closeout.py
          git add lib/messaging/mobile.ts app/'(app)'/messaging-actions.ts components/messages/messages-page-v4.tsx components/messaging/message-composer-v3.tsx lib/messaging/messaging-architecture-closeout.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: make messaging acknowledgement resilient and fast"
          git push origin HEAD:fix/messaging-architecture-closeout
