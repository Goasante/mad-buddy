name: Apply final interaction feedback wiring

on:
  push:
    branches:
      - feature/interaction-feedback
    paths:
      - tools/apply-feedback-final-gaps.py
      - .github/workflows/apply-feedback-final-gaps.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/interaction-feedback
          fetch-depth: 0

      - name: Apply reviewed feedback wiring
        run: python tools/apply-feedback-final-gaps.py

      - name: Commit wiring
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/friends/friends-page.tsx components/friends/muddy-profile-page.tsx components/contacts/find-muddies-sheet.tsx components/socialize/socialize-page.tsx components/messages/messages-page-v4.tsx
          git commit -m "wire remaining approved interaction feedback"
          git push origin HEAD:feature/interaction-feedback
