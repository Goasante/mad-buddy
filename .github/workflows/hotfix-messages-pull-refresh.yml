name: Hotfix Messages pull-to-refresh

on:
  push:
    branches:
      - hotfix/messages-pull-refresh-nested-scroll

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/messages-pull-refresh-nested-scroll
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch nested scroll pull-to-refresh guard
        run: python3 .github/scripts/hotfix-messages-pull-refresh.py
      - name: Install dependencies
        run: npm ci
      - name: Run focused regression test
        run: npx vitest run lib/navigation/mobile-shell.test.ts
      - name: Remove temporary hotfix helpers and commit
        shell: bash
        run: |
          rm .github/workflows/hotfix-messages-pull-refresh.yml
          rm .github/scripts/hotfix-messages-pull-refresh.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix nested Messages pull-to-refresh ownership"
          git push origin HEAD:hotfix/messages-pull-refresh-nested-scroll
