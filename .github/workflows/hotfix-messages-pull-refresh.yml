name: Hotfix Messages pull-to-refresh

on:
  push:
    branches:
      - hotfix/messages-pull-refresh-nested-scroll

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/messages-pull-refresh-nested-scroll
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch nested scroll pull-to-refresh guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ptr_path = Path("components/ui/pull-to-refresh.tsx")
          ptr = ptr_path.read_text()
          old = '''    const atTop = () => {
            const scrollOwner = document.querySelector<HTMLElement>("[data-app-scroll-owner]");
            return scrollOwner
              ? scrollOwner.scrollTop <= 0
              : window.scrollY <= 0 && document.documentElement.scrollTop <= 0;
          };
          '''
          # Match the repository's normal indentation rather than depending on YAML indentation.
          old = old.replace("            ", "      ").replace("          };", "    };")
          new = '''    const atTop = (target: EventTarget | null) => {
      const scrollOwner = document.querySelector<HTMLElement>("[data-app-scroll-owner]");
      if (scrollOwner) {
        if (scrollOwner.scrollTop > 0) return false;
      } else if (window.scrollY > 0 || document.documentElement.scrollTop > 0) {
        return false;
      }

      // Some pages (notably Messages) keep vertical scrolling inside a nested
      // list while the shell scroll owner stays pinned at 0. Respect the
      // element that actually owns this gesture, otherwise any downward drag
      // inside that list is mistaken for a page-level pull-to-refresh.
      if (!(target instanceof Element)) return true;
      let node: Element | null = target;
      while (node && node !== scrollOwner) {
        if (node instanceof HTMLElement) {
          const overflowY = window.getComputedStyle(node).overflowY;
          const isVerticalScroller =
            (overflowY === "auto" || overflowY === "scroll") &&
            node.scrollHeight > node.clientHeight + 1;
          if (isVerticalScroller) return node.scrollTop <= 0;
        }
        node = node.parentElement;
      }
      return true;
    };
'''
          if old not in ptr:
              raise SystemExit("expected atTop block not found")
          ptr = ptr.replace(old, new, 1)
          if 'if (!atTop() || shouldIgnore(event.target)) return;' not in ptr:
              raise SystemExit("touchstart guard not found")
          ptr = ptr.replace(
              'if (!atTop() || shouldIgnore(event.target)) return;',
              'if (!atTop(event.target) || shouldIgnore(event.target)) return;',
              1,
          )
          if 'if (!atTop()) {' not in ptr:
              raise SystemExit("touchmove guard not found")
          ptr = ptr.replace('if (!atTop()) {', 'if (!atTop(event.target)) {', 1)
          ptr_path.write_text(ptr)

          test_path = Path("lib/navigation/mobile-shell.test.ts")
          test = test_path.read_text()
          old_test = '''  it("only arms at the very top of the page", () => {
    expect(ptr).toContain("const atTop = ()");
    expect(ptr).toContain('[data-app-scroll-owner]');
    expect(ptr).toContain("scrollOwner.scrollTop <= 0");
    expect(ptr).toContain("if (!atTop()");
  });
'''
          new_test = '''  it("only arms at the top of the active vertical scroll container", () => {
    expect(ptr).toContain("const atTop = (target: EventTarget | null)");
    expect(ptr).toContain('[data-app-scroll-owner]');
    expect(ptr).toContain("if (scrollOwner.scrollTop > 0) return false");
    expect(ptr).toContain("node.scrollHeight > node.clientHeight + 1");
    expect(ptr).toContain("return node.scrollTop <= 0");
    expect(ptr).toContain("if (!atTop(event.target)");
  });
'''
          if old_test not in test:
              raise SystemExit("pull-to-refresh guard regression test not found")
          test_path.write_text(test.replace(old_test, new_test, 1))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run focused regression test
        run: npx vitest run lib/navigation/mobile-shell.test.ts
      - name: Remove temporary workflow and commit hotfix
        shell: bash
        run: |
          rm .github/workflows/hotfix-messages-pull-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/ui/pull-to-refresh.tsx lib/navigation/mobile-shell.test.ts .github/workflows/hotfix-messages-pull-refresh.yml
          git commit -m "fix nested Messages pull-to-refresh ownership"
          git push origin HEAD:hotfix/messages-pull-refresh-nested-scroll
