name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# TWO INDEPENDENT SIGNALS, DELIBERATELY NOT CHAINED.
#
# `build` used to be the last step of the single `quality` job, so a failing
# unit test SKIPPED it and GitHub reported nothing at all about whether the
# production bundle still compiled. Half the evidence disappeared exactly when
# something was already wrong -- and that is the moment it is most useful.
#
# `build` therefore has no `needs:` on `quality`. They run at the same time and
# report separately, so a red pipeline still says WHICH half is red:
#
#     quality = FAIL   build = PASS   -> a test regressed; the app compiles
#     quality = PASS   build = FAIL   -> the bundle broke; the tests missed it
#
# Overall CI is still red if either fails, which is correct. The point is not
# to hide a failure but to stop one failure from erasing the other's result.
jobs:
  quality:
    name: Quality (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Deliberately non-blocking: preflight checks that environment variables
      # are PRESENT, and a PR build legitimately has no production secrets.
      # The security gates below ask questions that CAN be answered without
      # credentials, so those are allowed to fail the build.
      - name: Environment preflight (structure only, no secrets required)
        run: node scripts/preflight.mjs || true

      # Fails the build on a committed credential. Never prints the value.
      - name: Secret scan (working tree)
        run: node scripts/security/scan-secrets.mjs

      # The lockfile must already satisfy package.json. `npm ci` above would
      # have failed on a mismatch, so this pins the intent: no silent drift,
      # and no install that resolves differently from what was reviewed.
      - name: Lockfile integrity
        run: npm ci --ignore-scripts --dry-run

      # Scoped to what actually ships. A High in a build-time-only native
      # tool (Capacitor CLI, image tooling) does not reach the deployed
      # runtime, and failing on it trains people to ignore the gate --
      # so this audits production dependencies only.
      - name: Dependency audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (privacy + route protection)
        run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    # No `needs:` on purpose -- see the comment above. This must still report
    # when the test job fails.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Deliberately minimal: lint, types and tests are the other job's answer.
      # This job exists to answer ONE question -- does the production bundle
      # still compile -- so it does not re-run them.
      - name: Production build
        run: npm run build
        env:
          # Build must succeed without real secrets; routes degrade to their
          # "not configured" responses when Supabase/Paystack env is absent.
          NEXT_PUBLIC_APP_URL: http://localhost:3000
