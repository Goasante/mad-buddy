name: Cron tick (backstop)

# RECOVERY BACKSTOP — NOT the primary scheduler.
#
# The primary scheduler is pg_cron inside Supabase (see the migration
# supabase/migrations/20260723180000_pg_cron_tick.sql), which fires
# /api/cron/tick every 5 minutes on a real schedule. That cadence matters:
# safe_arrival.unconfirmed_alert is a SAFETY job specified at every 5 minutes.
#
# This workflow exists only so a Supabase-side outage does not stop job
# processing entirely.
#
# Cadence history: "*/5" was misleading — measured on this repository it
# actually delivered roughly 12 runs a day with gaps of 57-201 minutes, and
# some runs were cancelled by GitHub before any step started. It was relaxed
# to "*/30", then tightened to "*/10" after an incident where a bad migration
# broke pg_cron for ~10 minutes and a 30-minute backstop covered none of it.
#
# GitHub will still not honour 10 minutes reliably — it throttles scheduled
# workflows regardless of what is declared. The point is to shorten the worst
# case when the PRIMARY scheduler is down, not to pretend this is a 10-minute
# scheduler.
#
# Both schedulers hit the SAME endpoint and the same idempotent runner:
#  - periodic enqueues collapse on a period-bucket idempotency key,
#  - claim_jobs uses FOR UPDATE SKIP LOCKED,
# so an overlapping Supabase and GitHub tick cannot run one job twice.
#
# The URL must be the canonical custom domain. mad-buddy.vercel.app 307s to
# mad-buddy.com, and curl drops the Authorization header when a redirect
# crosses hosts, so pointing at the vercel.app alias fails twice over: the
# unfollowed redirect is a non-2xx, and following it would arrive unauthorised.
# Overridable via a repository variable so the next domain change is a settings
# edit rather than a silent outage.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# A slow tick should never overlap itself into a pile-up.
concurrency:
  group: cron-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call cron tick endpoint
        env:
          TICK_URL: ${{ vars.CRON_TICK_URL || 'https://mad-buddy.com/api/cron/tick' }}
          # Identifies this scheduler in the tick summary. Observability only:
          # the endpoint runs identical work whatever the source says.
          TICK_SOURCE: github_backstop
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET is not set for this repository."
            exit 1
          fi

          # Retry transient network/cold-start blips before failing, so a
          # one-off hiccup doesn't page anyone. A real fault still fails.
          for attempt in 1 2 3; do
            status=$(curl -sS -o /tmp/tick-body.txt -w "%{http_code}" \
              --max-time 90 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${TICK_URL}?source=${TICK_SOURCE}" || echo "000")
            echo "attempt ${attempt}: status=${status}"

            if [ "${status}" -ge 200 ] && [ "${status}" -lt 300 ]; then
              # Counts only — the endpoint returns no payloads or user content.
              echo "tick ok"
              python3 -c "import json,sys;t=json.load(open('/tmp/tick-body.txt')).get('data',{}).get('tick',{});print('  source=%s considered=%s claimed=%s completed=%s retried=%s failed=%s duration=%sms'%(t.get('source'),t.get('jobsConsidered'),t.get('jobsClaimed'),t.get('jobsCompleted'),t.get('jobsRetried'),t.get('jobsFailed'),t.get('durationMs')))" 2>/dev/null || true
              exit 0
            fi

            # 401/404 here means the secret is wrong or the URL is not the
            # cron route — retrying cannot help, so fail fast and loudly.
            if [ "${status}" = "401" ] || [ "${status}" = "404" ]; then
              echo "Authorisation or routing problem, not retrying."
              head -c 500 /tmp/tick-body.txt || true
              exit 1
            fi

            sleep $((attempt * 5))
          done

          echo "Cron tick failed after 3 attempts (last status=${status})."
          head -c 500 /tmp/tick-body.txt || true
          exit 1
