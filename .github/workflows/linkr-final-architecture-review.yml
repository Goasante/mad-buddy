name: Final Linkr architecture review

on:
  push:
    paths:
      - ".github/workflows/linkr-final-architecture-review.yml"
      - ".github/scripts/linkr-final-review.py"

permissions:
  contents: write

jobs:
  review-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore legacy Socialize boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE=f30463da9677c8406eaa3f7b1eabf26e332e0c16
          git checkout "$BASE" -- 'app/(app)/actions.ts' 'app/(app)/social-actions.ts' 'app/api/friends/request/route.ts' 'lib/friends/service.ts' 'lib/social/socialize-mobile.ts' 'components/socialize/socialize-page.tsx' 'components/socialize/skipped-people-sheet.tsx'
          git rm -f --ignore-unmatch lib/social/linkr-interest.ts

      - name: Apply canonical Linkr fixes
        run: python3 .github/scripts/linkr-final-review.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Run Linkr regression suite
        run: npx vitest run lib/linkr/final-architecture-review.test.ts lib/linkr/connect-block-guard.test.ts lib/linkr/connect-race-migration.test.ts lib/linkr/conversation-ownership.test.ts lib/linkr/age-gate.test.ts lib/linkr/intent.test.ts

      - name: Commit reviewed architecture
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/linkr-final-architecture-review.yml .github/scripts/linkr-final-review.py
          git config user.name "Mad Buddy Architecture Review"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Finalize canonical Linkr reciprocity and rewind architecture"
          git push origin HEAD:main
