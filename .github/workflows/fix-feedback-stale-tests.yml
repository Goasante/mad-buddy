name: Fix stale feedback regression expectations

on:
  push:
    branches:
      - feature/interaction-feedback
    paths:
      - .github/workflows/fix-feedback-stale-tests.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/interaction-feedback
          fetch-depth: 0

      - name: Update stale regression expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "lib/contacts/contact-discovery-ui.test.ts",
              '''  it("uses the shared haptics abstraction rather than raw vibration", () => {
              expect(sheet).toContain('haptic("tick")');
              expect(sheet).toContain('haptic("select")');
              expect(sheet).not.toContain("navigator.vibrate");
              expect(settings).not.toContain("navigator.vibrate");
            });''',
              '''  it("uses the shared semantic feedback layer rather than raw vibration", () => {
              expect(sheet).toContain('haptic("tick")');
              expect(sheet).toContain('from "@/lib/feedback/feedback"');
              const add = sheet.slice(sheet.indexOf("function addMuddy"));
              expect(add).toContain("interactionFeedback.success()");
              expect(add).toContain("interactionFeedback.error()");
              expect(add.indexOf("interactionFeedback.success()")).toBeGreaterThan(
                add.indexOf("await sendFriendRequestAction(person.userId)")
              );
              expect(sheet).not.toContain("navigator.vibrate");
              expect(settings).not.toContain("navigator.vibrate");
            });'''
          )

          replace_once(
              "lib/navigation/quick-actions.test.ts",
              '''  it("confirms a completed drag with a tick, distinct from opening the sheet", () => {
              const pointerUp = component.slice(component.indexOf("function onPointerUp"));
              expect(pointerUp.slice(0, pointerUp.indexOf("function toggle"))).toContain('haptic("tick")');
            });''',
              '''  it("confirms a completed drag with semantic snap feedback, distinct from opening the sheet", () => {
              const pointerUp = component.slice(component.indexOf("function onPointerUp"));
              const release = pointerUp.slice(0, pointerUp.indexOf("function toggle"));
              expect(release).toContain("feedback.snap()");
              expect(release.indexOf("feedback.snap()")).toBeGreaterThan(release.indexOf("saveQuickActionsPosition"));
            });'''
          )
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git rm .github/workflows/fix-feedback-stale-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/contacts/contact-discovery-ui.test.ts lib/navigation/quick-actions.test.ts
          git commit -m "update legacy haptics regression expectations"
          git push origin HEAD:feature/interaction-feedback
