name: Apply interaction feedback wiring

on:
  push:
    branches:
      - feature/interaction-feedback
    paths:
      - tools/apply-feedback-polish.py
      - .github/workflows/apply-feedback-wiring.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/interaction-feedback
          fetch-depth: 0

      - name: Apply semantic long-press and snap wiring
        run: python tools/apply-feedback-polish.py

      - name: Commit wiring
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/ui/long-press-actions.tsx components/messaging/message-actions-menu.tsx components/app-shell/quick-actions-launcher.tsx lib/navigation/contextual-actions.test.ts lib/messaging/message-actions.test.ts lib/navigation/quick-actions.test.ts
          git commit -m "wire semantic long-press and snap feedback"
          git push origin HEAD:feature/interaction-feedback
