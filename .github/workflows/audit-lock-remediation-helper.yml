name: Audit lock remediation helper

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Set patched dependency floors
        run: |
          npm pkg set 'dependencies.sharp=^0.35.4'
          npm pkg set 'devDependencies.postcss=^8.5.23'
          npm pkg set 'overrides.@xmldom/xmldom=^0.9.12'
          npm pkg set 'overrides.baseline-browser-mapping=^2.11.0'
      - name: Regenerate lockfile without running package scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify runtime high/critical audit gate
        run: npm audit --omit=dev --audit-level=high
      - name: Show changed dependency files
        run: git diff --stat -- package.json package-lock.json
      - name: Upload remediated dependency files
        uses: actions/upload-artifact@v4
        with:
          name: audit-remediated-lockfile
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
