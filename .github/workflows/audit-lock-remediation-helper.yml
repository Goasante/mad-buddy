name: Audit lock remediation helper

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate non-breaking audit remediation
        run: npm audit fix --package-lock-only
      - name: Verify runtime high/critical audit gate
        run: npm audit --omit=dev --audit-level=high
      - name: Show changed dependency files
        run: git diff --stat -- package.json package-lock.json
      - name: Upload remediated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: audit-remediated-lockfile
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
