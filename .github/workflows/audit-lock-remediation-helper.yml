name: Audit lock remediation helper

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Set patched dependency floors
        run: |
          npm pkg set 'dependencies.sharp=^0.35.4'
          npm pkg set 'devDependencies.postcss=^8.5.23'
          npm pkg set 'overrides.@xmldom/xmldom=^0.9.12'
          npm pkg set 'overrides.baseline-browser-mapping=^2.11.0'
      - name: Regenerate lockfile without running package scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify runtime high/critical audit gate
        run: npm audit --omit=dev --audit-level=high
      - name: Commit verified dependency files when changed
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files already remediated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Remediate newly disclosed dependency advisories"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
