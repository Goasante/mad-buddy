name: One-shot Linkr hidden profile recovery

on:
  push:
    branches: [linkr-hidden-recovery]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Stage Linkr hidden profile recovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: linkr-hidden-recovery
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply Linkr recovery patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected snippet missing in {path}: {old[:140]!r}")
              p.write_text(text.replace(old, new, 1))

          # 1) Canonical collection for permanent "Don't show me again" choices.
          path = "lib/linkr/collections-service.ts"
          replace_once(
              path,
              '''export type PendingClick = {\n  userId: string;\n  displayName: string;\n  photo: string | null;\n  /** When THIS VIEWER chose them. Never anything about the other person. */\n  clickedAt: string;\n};\n''',
              '''export type PendingClick = {\n  userId: string;\n  displayName: string;\n  photo: string | null;\n  /** When THIS VIEWER chose them. Never anything about the other person. */\n  clickedAt: string;\n};\n\n/** A profile this viewer explicitly chose \"Don't show me again\" for. */\nexport type HiddenProfile = {\n  userId: string;\n  displayName: string;\n  photo: string | null;\n  hiddenAt: string;\n};\n'''
          )
          p = Path(path)
          p.write_text(p.read_text() + '''\n\n/**\n * HIDDEN PROFILES: permanent Pass rows owned by this viewer.\n *\n * This is intentionally separate from blocked_users. Hiding says \"do not put\n * this person back in my discovery deck\"; blocking is the stronger account-\n * wide safety boundary. The list reads only the viewer's own permanent Passes.\n */\nexport async function loadHiddenProfiles(viewerId: string): Promise<HiddenProfile[]> {\n  if (!serverReady()) return [];\n  const admin = createSupabaseAdminClient();\n\n  const { data: actions } = await admin\n    .from(\"linkr_actions\")\n    .select(\"target_id, updated_at\")\n    .eq(\"actor_id\", viewerId)\n    .eq(\"action\", \"pass\")\n    .is(\"expires_at\", null)\n    .order(\"updated_at\", { ascending: false });\n\n  const rows = actions ?? [];\n  if (rows.length === 0) return [];\n\n  const described = await describePeople(\n    admin,\n    rows.map((row) => row.target_id)\n  );\n\n  const hidden: HiddenProfile[] = [];\n  for (const row of rows) {\n    const person = described.get(row.target_id);\n    if (!person) continue;\n    hidden.push({\n      userId: row.target_id,\n      displayName: person.displayName,\n      photo: person.photo,\n      hiddenAt: row.updated_at\n    });\n  }\n  return hidden;\n}\n''')

          # 2) Reversing a permanent hide is a narrow Linkr mutation, not an unblock.
          path = "lib/linkr/connection-service.ts"
          marker = '''/**\n * Connect: private interest, which becomes a connection only if returned.\n'''
          restore = '''/**\n * Restore a profile previously hidden with \"Don't show me again\".\n *\n * Only the caller's own permanent Pass is removed. This does not undo a block,\n * create a connection, reveal the other person's choices, or override any\n * current Linkr eligibility rule.\n */\nexport async function restoreHiddenProfile(\n  viewerId: string,\n  targetId: string\n): Promise<{ ok: boolean; message: string }> {\n  if (!serverReady()) return { ok: false, message: \"This action needs the server database configuration.\" };\n  const parsed = z.string().uuid().safeParse(targetId);\n  if (!parsed.success || parsed.data === viewerId) return { ok: false, message: \"That profile is no longer available.\" };\n\n  const limit = await consumeRateLimit({ action: \"linkr.decide\", userId: viewerId });\n  if (!limit.allowed) return { ok: false, message: rateLimitMessage(limit.resetAt) };\n\n  const admin = createSupabaseAdminClient();\n  const guard = await guardAction(admin, { userId: viewerId, surface: \"linkr\" });\n  if (!guard.allowed) return { ok: false, message: guard.message };\n\n  const { error } = await admin\n    .from(\"linkr_actions\")\n    .delete()\n    .eq(\"actor_id\", viewerId)\n    .eq(\"target_id\", parsed.data)\n    .eq(\"action\", \"pass\")\n    .is(\"expires_at\", null);\n\n  if (error) return { ok: false, message: \"That profile could not be restored. Try again.\" };\n  return { ok: true, message: \"They can appear in Linkr again.\" };\n}\n\n'''
          replace_once(path, marker, restore + marker)

          # 3) Authenticated server actions for list + restore.
          path = "app/(app)/linkr-actions.ts"
          replace_once(
              path,
              '''  passCandidate,\n  requestLinkrPassReversalReview,\n  undoLastLinkrAction,''',
              '''  passCandidate,\n  requestLinkrPassReversalReview,\n  restoreHiddenProfile,\n  undoLastLinkrAction,'''
          )
          replace_once(
              path,
              '''import { loadClickedPeople, loadPendingClicks } from \"@/lib/linkr/collections-service\";''',
              '''import { loadClickedPeople, loadHiddenProfiles, loadPendingClicks } from \"@/lib/linkr/collections-service\";'''
          )
          replace_once(
              path,
              '''export async function connectWithCandidateAction(input: {''',
              '''export async function restoreHiddenProfileAction(targetId: string): Promise<LinkrActionResult> {\n  const userId = await getAuthedUserId();\n  if (!userId) return NOT_LOGGED_IN;\n  const result = await restoreHiddenProfile(userId, targetId);\n  if (result.ok) revalidatePath(\"/linkr\");\n  return result;\n}\n\nexport async function connectWithCandidateAction(input: {'''
          )
          replace_once(
              path,
              '''export async function loadPendingClicksAction() {\n  const userId = await getAuthedUserId();\n  return userId ? loadPendingClicks(userId) : [];\n}\n''',
              '''export async function loadPendingClicksAction() {\n  const userId = await getAuthedUserId();\n  return userId ? loadPendingClicks(userId) : [];\n}\n\n/** Permanent \"Don't show me again\" choices owned by this viewer. */\nexport async function loadHiddenProfilesAction() {\n  const userId = await getAuthedUserId();\n  return userId ? loadHiddenProfiles(userId) : [];\n}\n'''
          )

          # 4) Linkr settings: make Blocks and Hidden profiles visibly distinct.
          path = "components/linkr/linkr-settings.tsx"
          replace_once(
              path,
              '''\"use client\";\n\nimport { ArrowLeft, ChevronRight } from \"lucide-react\";''',
              '''\"use client\";\n\nimport { useState } from \"react\";\nimport { ArrowLeft, ChevronRight, RotateCcw } from \"lucide-react\";'''
          )
          replace_once(
              path,
              '''import type { LinkrOwnProfile } from \"@/lib/linkr/profile-service\";''',
              '''import type { LinkrOwnProfile } from \"@/lib/linkr/profile-service\";\nimport type { HiddenProfile } from \"@/lib/linkr/collections-service\";'''
          )
          replace_once(
              path,
              '''  hiddenCount: number;\n  onToggleEnabled: (enabled: boolean) => Promise<void>;\n  onToggleEventMode: (enabled: boolean) => Promise<void>;\n  onOpenFilters: () => void;\n  onOpenBlocked: () => void;\n  onBack: () => void;\n  busy?: boolean;''',
              '''  blockedCount: number;\n  hiddenProfiles: readonly HiddenProfile[];\n  hiddenProfilesLoading?: boolean;\n  onRestoreHidden: (userId: string) => Promise<{ ok: boolean; message: string }>;\n  onToggleEnabled: (enabled: boolean) => Promise<void>;\n  onToggleEventMode: (enabled: boolean) => Promise<void>;\n  onOpenFilters: () => void;\n  onOpenBlocked: () => void;\n  onBack: () => void;\n  busy?: boolean;'''
          )
          replace_once(
              path,
              '''  profile,\n  hiddenCount,\n  onToggleEnabled,\n  onToggleEventMode,\n  onOpenFilters,\n  onOpenBlocked,\n  onBack,\n  busy\n}: LinkrSettingsProps) {\n  const distanceLabel =''',
              '''  profile,\n  blockedCount,\n  hiddenProfiles,\n  hiddenProfilesLoading = false,\n  onRestoreHidden,\n  onToggleEnabled,\n  onToggleEventMode,\n  onOpenFilters,\n  onOpenBlocked,\n  onBack,\n  busy\n}: LinkrSettingsProps) {\n  const [restoringId, setRestoringId] = useState<string | null>(null);\n  const [hiddenStatus, setHiddenStatus] = useState<string | null>(null);\n  const distanceLabel ='''
          )
          replace_once(
              path,
              '''        {/* Blocking is account-wide and canonical. Linkr links to it rather\n            than keeping a second list that could disagree with the real one. */}\n        <SettingRow label=\"Hide from specific people\" value={`${hiddenCount} people`} onClick={onOpenBlocked} />\n\n        <h2 className=\"linkr-settings__group\">Preferences</h2>''',
              '''        {/* Blocking is account-wide and canonical. Permanent Linkr hides are\n            a different, lighter choice and are managed immediately below. */}\n        <SettingRow\n          label=\"Blocked people\"\n          value={blockedCount === 1 ? \"1 person\" : `${blockedCount} people`}\n          onClick={onOpenBlocked}\n        />\n\n        <h2 className=\"linkr-settings__group\">Hidden profiles</h2>\n        <p className=\"linkr-settings__note\">\n          People you chose “Don’t show me again” for. Showing someone again does not connect you or undo a block.\n        </p>\n        {hiddenProfilesLoading ? (\n          <p className=\"linkr-collection__empty\">Loading hidden profiles…</p>\n        ) : hiddenProfiles.length === 0 ? (\n          <p className=\"linkr-collection__empty\">No hidden profiles.</p>\n        ) : (\n          <ul className=\"linkr-collection\">\n            {hiddenProfiles.map((person) => (\n              <li key={person.userId}>\n                <div className=\"linkr-collection__row linkr-collection__row--static\">\n                  <HiddenFace photo={person.photo} name={person.displayName} />\n                  <span className=\"linkr-collection__text\">\n                    <strong>{person.displayName}</strong>\n                    <small>Hidden from your Linkr discovery</small>\n                  </span>\n                  <button\n                    type=\"button\"\n                    className=\"linkr-link\"\n                    disabled={busy || restoringId === person.userId}\n                    onClick={() => {\n                      void (async () => {\n                        setRestoringId(person.userId);\n                        const result = await onRestoreHidden(person.userId);\n                        setHiddenStatus(result.message);\n                        setRestoringId(null);\n                      })();\n                    }}\n                  >\n                    <RotateCcw aria-hidden />\n                    {restoringId === person.userId ? \"Restoring…\" : \"Show again\"}\n                  </button>\n                </div>\n              </li>\n            ))}\n          </ul>\n        )}\n        {hiddenStatus ? <p className=\"linkr-settings__note\" role=\"status\">{hiddenStatus}</p> : null}\n\n        <h2 className=\"linkr-settings__group\">Preferences</h2>'''
          )
          p = Path(path)
          p.write_text(p.read_text() + '''\n\nfunction HiddenFace({ photo, name }: { photo: string | null; name: string }) {\n  return photo ? (\n    // eslint-disable-next-line @next/next/no-img-element -- signed, short-lived media URL\n    <img src={photo} alt=\"\" className=\"linkr-collection__face\" />\n  ) : (\n    <span className=\"linkr-collection__face linkr-collection__face--fallback\" aria-hidden>\n      {name.charAt(0).toUpperCase()}\n    </span>\n  );\n}\n''')

          # 5) Linkr page: keep Undo reachable on an empty deck and load/manage hidden profiles.
          path = "components/linkr/linkr-page.tsx"
          replace_once(
              path,
              '''import { ArrowLeft, Flag, Hand, MoreHorizontal } from \"lucide-react\";''',
              '''import { ArrowLeft, Flag, Hand, MoreHorizontal, RotateCcw } from \"lucide-react\";'''
          )
          replace_once(
              path,
              '''  loadClickedPeopleAction,\n  loadLinkrCandidatesAction,\n  loadPendingClicksAction,\n  passCandidateAction,\n  resolveMutualDestinationAction,\n  requestLinkrPassReversalReviewAction,\n  undoLinkrActionAction,''',
              '''  loadClickedPeopleAction,\n  loadHiddenProfilesAction,\n  loadLinkrCandidatesAction,\n  loadPendingClicksAction,\n  passCandidateAction,\n  resolveMutualDestinationAction,\n  requestLinkrPassReversalReviewAction,\n  restoreHiddenProfileAction,\n  undoLinkrActionAction,'''
          )
          replace_once(
              path,
              '''import type { ClickedPerson, PendingClick } from \"@/lib/linkr/collections-service\";''',
              '''import type { ClickedPerson, HiddenProfile, PendingClick } from \"@/lib/linkr/collections-service\";'''
          )
          replace_once(
              path,
              '''  const [clicked, setClicked] = useState<ClickedPerson[]>([]);\n  const [pendingClicks, setPendingClicks] = useState<PendingClick[]>([]);\n  const [canUndo, setCanUndo] = useState(false);''',
              '''  const [clicked, setClicked] = useState<ClickedPerson[]>([]);\n  const [pendingClicks, setPendingClicks] = useState<PendingClick[]>([]);\n  const [hiddenProfiles, setHiddenProfiles] = useState<HiddenProfile[]>([]);\n  const [hiddenProfilesLoading, setHiddenProfilesLoading] = useState(false);\n  const [canUndo, setCanUndo] = useState(false);'''
          )
          replace_once(
              path,
              '''  /**\n   * Open one mutual person, resolving what that means RIGHT NOW.\n''',
              '''  const refreshHiddenProfiles = useCallback(async () => {\n    setHiddenProfilesLoading(true);\n    try {\n      setHiddenProfiles(await loadHiddenProfilesAction());\n    } finally {\n      setHiddenProfilesLoading(false);\n    }\n  }, []);\n\n  /**\n   * Open one mutual person, resolving what that means RIGHT NOW.\n'''
          )
          replace_once(
              path,
              '''        profile={profile}\n        hiddenCount={blockedCount}\n        busy={pending || writing}\n        onBack={() => setView(\"discover\")}\n        onOpenFilters={() => setView(\"filters\")}''',
              '''        profile={profile}\n        blockedCount={blockedCount}\n        hiddenProfiles={hiddenProfiles}\n        hiddenProfilesLoading={hiddenProfilesLoading}\n        busy={pending || writing}\n        onBack={() => setView(\"discover\")}\n        onOpenFilters={() => setView(\"filters\")}\n        onRestoreHidden={async (targetId) => {\n          const result = await restoreHiddenProfileAction(targetId);\n          if (result.ok) {\n            setHiddenProfiles((current) => current.filter((person) => person.userId !== targetId));\n            refreshDeck();\n          }\n          return result;\n        }}'''
          )
          replace_once(
              path,
              '''                id: \"settings\",\n                label: \"Linkr settings\",\n                separatorBefore: true,\n                onSelect: () => setView(\"settings\")''',
              '''                id: \"settings\",\n                label: \"Linkr settings\",\n                separatorBefore: true,\n                onSelect: () => {\n                  setView(\"settings\");\n                  void refreshHiddenProfiles();\n                }'''
          )
          replace_once(
              path,
              '''      ) : (\n        <LinkrEmptyState''',
              '''      ) : (\n        <>\n          <LinkrEmptyState'''
          )
          replace_once(
              path,
              '''          }}\n        />\n      )}\n\n      {match ? (''',
              '''          }}\n          />\n          {canUndo ? (\n            <div className=\"linkr-card-helper\">\n              <button\n                type=\"button\"\n                className=\"linkr-action linkr-action--undo\"\n                onClick={handleUndo}\n                disabled={pending || writing}\n              >\n                <RotateCcw aria-hidden />\n                <span>Undo last pass</span>\n              </button>\n            </div>\n          ) : reviewTargetId ? (\n            <div className=\"linkr-card-helper\">\n              <button\n                type=\"button\"\n                className=\"linkr-action linkr-action--undo\"\n                onClick={handleRequestReview}\n                disabled={pending || writing}\n              >\n                <RotateCcw aria-hidden />\n                <span>Ask support</span>\n              </button>\n            </div>\n          ) : null}\n        </>\n      )}\n\n      {match ? ('''
          )

          # 6) A permanent regression gate for the exact bug found in live testing.
          Path("lib/linkr/hidden-profile-recovery.test.ts").write_text('''import { readFileSync } from "node:fs";\nimport { join } from "node:path";\nimport { describe, expect, it } from "vitest";\n\nconst read = (path: string) => readFileSync(join(process.cwd(), path), "utf8");\n\ndescribe("Linkr hidden-profile recovery", () => {\n  it("keeps permanent hides separate from account blocks", () => {\n    const service = read("lib/linkr/collections-service.ts");\n    const settings = read("components/linkr/linkr-settings.tsx");\n    expect(service).toContain('.eq("action", "pass")');\n    expect(service).toContain('.is("expires_at", null)');\n    expect(settings).toContain("Hidden profiles");\n    expect(settings).toContain("Blocked people");\n    expect(settings).toContain("Show again");\n  });\n\n  it("restores only the viewer-owned permanent pass", () => {\n    const service = read("lib/linkr/connection-service.ts");\n    expect(service).toContain("export async function restoreHiddenProfile");\n    expect(service).toContain('.eq("actor_id", viewerId)');\n    expect(service).toContain('.eq("target_id", parsed.data)');\n    expect(service).toContain('.eq("action", "pass")');\n    expect(service).toContain('.is("expires_at", null)');\n  });\n\n  it("keeps undo reachable when the deck is empty", () => {\n    const page = read("components/linkr/linkr-page.tsx");\n    expect(page).toContain("Undo last pass");\n    expect(page).toContain("<LinkrEmptyState");\n    expect(page).toMatch(/LinkrEmptyState[\\s\\S]*canUndo[\\s\\S]*Undo last pass/);\n  });\n});\n''')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Targeted tests
        run: npx vitest run lib/linkr/hidden-profile-recovery.test.ts lib/linkr/final-architecture-review.test.ts

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/linkr-hidden-recovery-once.yml
          git config user.name "Goasante"
          git config user.email "godfredasante004@gmail.com"
          git add -A
          git commit -m "Fix Linkr empty undo and add hidden profiles"
          git push origin HEAD:linkr-hidden-recovery
