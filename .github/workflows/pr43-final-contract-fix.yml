name: PR43 final contract fix

on:
  push:
    branches:
      - fix/event-room-qr-attachments-mobile-shell

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/event-room-qr-attachments-mobile-shell
      - name: Update stale accessibility contract and clean diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("lib/messaging/attachments.test.ts")
          text = path.read_text()
          old = '''  it("labels the attachment control and the remove button", () => {\n    expect(picker).toContain('aria-label="Add an attachment"');\n    expect(picker).toContain('aria-label="Remove photo"');\n  });'''
          new = '''  it("labels the attachment control and kind-specific remove actions", () => {\n    expect(picker).toContain('aria-label="Add an attachment"');\n    expect(picker).toContain('"Remove document"');\n    expect(picker).toContain('"Remove video"');\n    expect(picker).toContain('"Remove photo"');\n  });'''
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one stale accessibility contract, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY

          rm -f .github/workflows/pr43-last-test-diagnostic.yml
          rm -f .github/workflows/pr43-final-contract-fix.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/messaging/attachments.test.ts \
                  .github/workflows/pr43-last-test-diagnostic.yml \
                  .github/workflows/pr43-final-contract-fix.yml
          git diff --cached --check
          git commit -m "test: align attachment removal accessibility contract"
          git push origin HEAD:fix/event-room-qr-attachments-mobile-shell
