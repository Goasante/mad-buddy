name: Linkr architecture integration

on:
  push:
    paths:
      - .github/workflows/linkr-architecture-patch.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded source edits
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected snippet missing in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # Keep ALL pending requests visible to the server regardless of age.
          # Only declined Linkr interest needs the 30-day lookup window.
          old = '''    const requestCutoffIso = new Date(Date.parse(nowIso) - LINKR_PASS_COOLDOWN_MS).toISOString();
    const { data: requests } = await admin
      .from("friend_requests")
      .select("sender_id, receiver_id, status, context_type, created_at, responded_at")
      .in("status", ["pending", "declined"])
      .or(`sender_id.eq.${userId},receiver_id.eq.${userId}`)
      .gte("created_at", requestCutoffIso);

    const pendingRequests = (requests ?? []).filter((request) => request.status === "pending");
    const sentTo = new Set(
      pendingRequests.filter((request) => request.sender_id === userId).map((request) => request.receiver_id)
    );
    // Ordinary incoming requests remain visible through their normal Accept
    // state. Linkr interest is different: it stays private until reciprocal.
    const receivedFrom = new Set(
      pendingRequests
        .filter((request) => request.receiver_id === userId && request.context_type !== "socialize")
        .map((request) => request.sender_id)
    );
    const inboundLinkrInterest = new Map<string, string>();
    for (const request of pendingRequests) {
      if (request.receiver_id === userId && request.context_type === "socialize") {
        const existing = inboundLinkrInterest.get(request.sender_id);
        if (!existing || Date.parse(request.created_at) > Date.parse(existing)) {
          inboundLinkrInterest.set(request.sender_id, request.created_at);
        }
      }
    }
    const recentDeclinedOutgoing = new Set(
      (requests ?? [])
        .filter((request) => {
          if (request.sender_id !== userId || request.context_type !== "socialize" || request.status !== "declined") return false;
          const declinedAt = Date.parse(request.responded_at ?? request.created_at);
          return Number.isFinite(declinedAt) && Date.parse(nowIso) - declinedAt < LINKR_PASS_COOLDOWN_MS;
        })
        .map((request) => request.receiver_id)
    );'''
          new = '''    const requestCutoffIso = new Date(Date.parse(nowIso) - LINKR_PASS_COOLDOWN_MS).toISOString();
    const [pendingRequestResult, declinedRequestResult] = await Promise.all([
      admin
        .from("friend_requests")
        .select("sender_id, receiver_id, status, context_type, created_at, responded_at")
        .eq("status", "pending")
        .or(`sender_id.eq.${userId},receiver_id.eq.${userId}`),
      admin
        .from("friend_requests")
        .select("sender_id, receiver_id, status, context_type, created_at, responded_at")
        .eq("sender_id", userId)
        .eq("status", "declined")
        .eq("context_type", "socialize")
        .gte("responded_at", requestCutoffIso)
    ]);

    const pendingRequests = pendingRequestResult.data ?? [];
    const sentTo = new Set(
      pendingRequests.filter((request) => request.sender_id === userId).map((request) => request.receiver_id)
    );
    // Ordinary incoming requests remain visible through their normal Accept
    // state. Linkr interest is different: it stays private until reciprocal.
    const receivedFrom = new Set(
      pendingRequests
        .filter((request) => request.receiver_id === userId && request.context_type !== "socialize")
        .map((request) => request.sender_id)
    );
    const inboundLinkrInterest = new Map<string, string>();
    for (const request of pendingRequests) {
      if (request.receiver_id === userId && request.context_type === "socialize") {
        const existing = inboundLinkrInterest.get(request.sender_id);
        if (!existing || Date.parse(request.created_at) > Date.parse(existing)) {
          inboundLinkrInterest.set(request.sender_id, request.created_at);
        }
      }
    }
    const recentDeclinedOutgoing = new Set(
      (declinedRequestResult.data ?? []).map((request) => request.receiver_id)
    );'''
          replace_once("lib/social/socialize-mobile.ts", old, new)

          # Server-side enforcement: the admin escalation is available only
          # after the three-rewind allowance is actually exhausted. A crafted
          # request cannot skip straight to staff review.
          old = '''  if (passError) return { ok: false, message: "Couldn't prepare that request. Try again." };
  if (!pass) return { ok: true, message: "That profile is already eligible to appear again." };

  const supportLimit = await consumeRateLimit({ action: "support.request", userId, requestId });'''
          new = '''  if (passError) return { ok: false, message: "Couldn't prepare that request. Try again." };
  if (!pass) return { ok: true, message: "That profile is already eligible to appear again." };

  const { data: rewindWindow } = await admin
    .from("rate_limits")
    .select("count, window_end")
    .eq("user_id", userId)
    .eq("action", "linkr.undo")
    .gt("window_end", new Date().toISOString())
    .order("window_end", { ascending: false })
    .limit(1)
    .maybeSingle();
  if (!rewindWindow || rewindWindow.count < 3) {
    return { ok: false, message: "Use your available Linkr rewinds first. Admin review opens after all 3 are used." };
  }

  const supportLimit = await consumeRateLimit({ action: "support.request", userId, requestId });'''
          replace_once("app/(app)/social-actions.ts", old, new)
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Run Linkr tests
        run: npx vitest run lib/social/discovery-passes.test.ts lib/social/consecutive-swipe.test.ts lib/social/swipe-feedback.test.ts

      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "Mad Buddy Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/'(app)'/social-actions.ts lib/social/socialize-mobile.ts
          git commit -m "Tighten Linkr reciprocity and rewind review"
          git push origin HEAD:main
