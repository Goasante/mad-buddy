name: Linkr architecture integration

on:
  push:
    paths:
      - .github/workflows/linkr-architecture-patch.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded source edits
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected snippet missing in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          old_requests = (
              '    const requestCutoffIso = new Date(Date.parse(nowIso) - LINKR_PASS_COOLDOWN_MS).toISOString();\n'
              '    const { data: requests } = await admin\n'
              '      .from("friend_requests")\n'
              '      .select("sender_id, receiver_id, status, context_type, created_at, responded_at")\n'
              '      .in("status", ["pending", "declined"])\n'
              '      .or(`sender_id.eq.${userId},receiver_id.eq.${userId}`)\n'
              '      .gte("created_at", requestCutoffIso);\n\n'
              '    const pendingRequests = (requests ?? []).filter((request) => request.status === "pending");\n'
              '    const sentTo = new Set(\n'
              '      pendingRequests.filter((request) => request.sender_id === userId).map((request) => request.receiver_id)\n'
              '    );\n'
              '    // Ordinary incoming requests remain visible through their normal Accept\n'
              '    // state. Linkr interest is different: it stays private until reciprocal.\n'
              '    const receivedFrom = new Set(\n'
              '      pendingRequests\n'
              '        .filter((request) => request.receiver_id === userId && request.context_type !== "socialize")\n'
              '        .map((request) => request.sender_id)\n'
              '    );\n'
              '    const inboundLinkrInterest = new Map<string, string>();\n'
              '    for (const request of pendingRequests) {\n'
              '      if (request.receiver_id === userId && request.context_type === "socialize") {\n'
              '        const existing = inboundLinkrInterest.get(request.sender_id);\n'
              '        if (!existing || Date.parse(request.created_at) > Date.parse(existing)) {\n'
              '          inboundLinkrInterest.set(request.sender_id, request.created_at);\n'
              '        }\n'
              '      }\n'
              '    }\n'
              '    const recentDeclinedOutgoing = new Set(\n'
              '      (requests ?? [])\n'
              '        .filter((request) => {\n'
              '          if (request.sender_id !== userId || request.context_type !== "socialize" || request.status !== "declined") return false;\n'
              '          const declinedAt = Date.parse(request.responded_at ?? request.created_at);\n'
              '          return Number.isFinite(declinedAt) && Date.parse(nowIso) - declinedAt < LINKR_PASS_COOLDOWN_MS;\n'
              '        })\n'
              '        .map((request) => request.receiver_id)\n'
              '    );'
          )
          new_requests = (
              '    const requestCutoffIso = new Date(Date.parse(nowIso) - LINKR_PASS_COOLDOWN_MS).toISOString();\n'
              '    const [pendingRequestResult, declinedRequestResult] = await Promise.all([\n'
              '      admin\n'
              '        .from("friend_requests")\n'
              '        .select("sender_id, receiver_id, status, context_type, created_at, responded_at")\n'
              '        .eq("status", "pending")\n'
              '        .or(`sender_id.eq.${userId},receiver_id.eq.${userId}`),\n'
              '      admin\n'
              '        .from("friend_requests")\n'
              '        .select("sender_id, receiver_id, status, context_type, created_at, responded_at")\n'
              '        .eq("sender_id", userId)\n'
              '        .eq("status", "declined")\n'
              '        .eq("context_type", "socialize")\n'
              '        .gte("responded_at", requestCutoffIso)\n'
              '    ]);\n\n'
              '    const pendingRequests = pendingRequestResult.data ?? [];\n'
              '    const sentTo = new Set(\n'
              '      pendingRequests.filter((request) => request.sender_id === userId).map((request) => request.receiver_id)\n'
              '    );\n'
              '    // Ordinary incoming requests remain visible through their normal Accept\n'
              '    // state. Linkr interest is different: it stays private until reciprocal.\n'
              '    const receivedFrom = new Set(\n'
              '      pendingRequests\n'
              '        .filter((request) => request.receiver_id === userId && request.context_type !== "socialize")\n'
              '        .map((request) => request.sender_id)\n'
              '    );\n'
              '    const inboundLinkrInterest = new Map<string, string>();\n'
              '    for (const request of pendingRequests) {\n'
              '      if (request.receiver_id === userId && request.context_type === "socialize") {\n'
              '        const existing = inboundLinkrInterest.get(request.sender_id);\n'
              '        if (!existing || Date.parse(request.created_at) > Date.parse(existing)) {\n'
              '          inboundLinkrInterest.set(request.sender_id, request.created_at);\n'
              '        }\n'
              '      }\n'
              '    }\n'
              '    const recentDeclinedOutgoing = new Set(\n'
              '      (declinedRequestResult.data ?? []).map((request) => request.receiver_id)\n'
              '    );'
          )
          replace_once("lib/social/socialize-mobile.ts", old_requests, new_requests)

          old_escalation = (
              '  if (passError) return { ok: false, message: "Couldn\'t prepare that request. Try again." };\n'
              '  if (!pass) return { ok: true, message: "That profile is already eligible to appear again." };\n\n'
              '  const supportLimit = await consumeRateLimit({ action: "support.request", userId, requestId });'
          )
          new_escalation = (
              '  if (passError) return { ok: false, message: "Couldn\'t prepare that request. Try again." };\n'
              '  if (!pass) return { ok: true, message: "That profile is already eligible to appear again." };\n\n'
              '  const { data: rewindWindow } = await admin\n'
              '    .from("rate_limits")\n'
              '    .select("count, window_end")\n'
              '    .eq("user_id", userId)\n'
              '    .eq("action", "linkr.undo")\n'
              '    .gt("window_end", new Date().toISOString())\n'
              '    .order("window_end", { ascending: false })\n'
              '    .limit(1)\n'
              '    .maybeSingle();\n'
              '  if (!rewindWindow || rewindWindow.count < 3) {\n'
              '    return { ok: false, message: "Use your available Linkr rewinds first. Admin review opens after all 3 are used." };\n'
              '  }\n\n'
              '  const supportLimit = await consumeRateLimit({ action: "support.request", userId, requestId });'
          )
          replace_once("app/(app)/social-actions.ts", old_escalation, new_escalation)
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Run Linkr tests
        run: npx vitest run lib/social/discovery-passes.test.ts lib/social/consecutive-swipe.test.ts lib/social/swipe-feedback.test.ts

      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "Mad Buddy Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/'(app)'/social-actions.ts lib/social/socialize-mobile.ts
          git commit -m "Tighten Linkr reciprocity and rewind review"
          git push origin HEAD:main
