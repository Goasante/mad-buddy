name: One-shot Linkr rewind request reporting

on:
  push:
    branches:
      - linkr-rewind-reporting-20260922

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: linkr-rewind-reporting-20260922
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply rewind reporting patch
        run: |
          python scripts/one-shot-linkr-rewind-reporting.py
          sed -i '/setRewindRequestsLoading(true);/d' components/linkr/linkr-settings.tsx
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test -- --run
      - name: Production build
        run: npm run build
      - name: Remove one-shot files and commit
        run: |
          rm .github/workflows/linkr-rewind-reporting-once.yml
          rm scripts/one-shot-linkr-rewind-reporting.py
          git config user.name "Goasante"
          git config user.email "godfredasante004@gmail.com"
          git add -A
          git commit -m "Surface Linkr rewind requests to users and admins"
          git push origin HEAD:linkr-rewind-reporting-20260922
