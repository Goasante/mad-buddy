name: One-time dependency lock hardening

on:
  push:
    branches:
      - hardening/conference-final-app

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/conference-final-app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh vulnerable runtime packages within existing semver ranges
        run: npm audit fix --package-lock-only --omit=dev
      - name: Verify runtime audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit lockfile hardening
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh vulnerable runtime dependencies"
          git push origin HEAD:hardening/conference-final-app

# Triggered only for this hardening branch; delete after lock refresh.
