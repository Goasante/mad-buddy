name: Landing Final Verification Temporary

on:
  push:
    branches: [feat/landing-god-mode-redesign]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      BASE_SHA: 26c397437171dfe58a5de748f8f1a623d44ccb48
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare identical base and landing worktrees
        run: |
          git worktree add /tmp/mb-base "$BASE_SHA"
          mkdir -p verification/screenshots
          printf 'BASE_SHA=%s\nLANDING_SHA=%s\n' "$BASE_SHA" "$GITHUB_SHA" | tee verification/shas.txt

      - name: Install base dependencies
        working-directory: /tmp/mb-base
        run: npm ci

      - name: Install landing dependencies
        run: npm ci

      - name: Run exact BASE full suite
        shell: bash
        run: |
          set +e
          cd /tmp/mb-base
          npx vitest run 2>&1 | tee "$GITHUB_WORKSPACE/verification/base-vitest.log"
          status=${PIPESTATUS[0]}
          echo "$status" > "$GITHUB_WORKSPACE/verification/base-vitest.status"
          exit 0

      - name: Run exact LANDING full suite
        shell: bash
        run: |
          set +e
          npx vitest run 2>&1 | tee verification/landing-vitest.log
          status=${PIPESTATUS[0]}
          echo "$status" > verification/landing-vitest.status
          exit 0

      - name: Final landing quality gates
        run: |
          npm run lint
          npm run typecheck
          npm run build

      - name: Build BASE for synthetic comparison
        working-directory: /tmp/mb-base
        run: npm run build

      - name: Install Chromium for visual proof
        run: npx playwright install --with-deps chromium

      - name: Create headless verification harness
        shell: bash
        run: |
          cat > verification/landing-headless.mjs <<'EOF'
          import { chromium } from "playwright";
          import { writeFile } from "node:fs/promises";

          const browser = await chromium.launch({ headless: true });
          const viewports = [
            { name: "360x800", width: 360, height: 800 },
            { name: "390x844", width: 390, height: 844 },
            { name: "430x932", width: 430, height: 932 },
            { name: "1440x1000", width: 1440, height: 1000 }
          ];
          const results = [];

          for (const viewport of viewports) {
            const page = await browser.newPage({ viewport: { width: viewport.width, height: viewport.height }, colorScheme: "light" });
            const pageErrors = [];
            page.on("pageerror", (error) => pageErrors.push(String(error)));
            await page.goto("http://127.0.0.1:3000/", { waitUntil: "networkidle" });

            const audit = await page.evaluate(() => {
              const doc = document.documentElement;
              const visible = (el) => {
                const r = el.getBoundingClientRect();
                const style = getComputedStyle(el);
                return r.width > 0 && r.height > 0 && style.visibility !== "hidden" && style.display !== "none";
              };
              const interactive = [...document.querySelectorAll("a,button,input,select,textarea,[role='button']")].filter(visible);
              const smallTargets = interactive
                .map((el) => {
                  const r = el.getBoundingClientRect();
                  return { text: (el.getAttribute("aria-label") || el.textContent || el.tagName).trim().replace(/\s+/g, " ").slice(0, 80), width: Math.round(r.width), height: Math.round(r.height) };
                })
                .filter((item) => item.width < 44 || item.height < 44);
              const clipped = [...document.querySelectorAll("h1,h2,h3,p,li,a,button,span")]
                .filter(visible)
                .filter((el) => {
                  const style = getComputedStyle(el);
                  const clips = ["hidden", "clip"].includes(style.overflow) || ["hidden", "clip"].includes(style.overflowX) || ["hidden", "clip"].includes(style.overflowY);
                  return clips && (el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > el.clientHeight + 1);
                })
                .map((el) => (el.textContent || el.tagName).trim().replace(/\s+/g, " ").slice(0, 100));
              const brokenImages = [...document.images].filter((img) => !img.complete || img.naturalWidth === 0).map((img) => img.currentSrc || img.src);
              const sections = [...document.querySelectorAll("main section")].map((section) => {
                const r = section.getBoundingClientRect();
                return { id: section.id || "(no id)", height: Math.round(r.height), viewportRatio: Number((r.height / innerHeight).toFixed(2)) };
              });
              return {
                horizontalOverflowPx: Math.max(0, doc.scrollWidth - doc.clientWidth),
                brokenImages,
                smallTargets,
                clipped,
                sections
              };
            });

            let menu = null;
            if (viewport.width < 768) {
              const trigger = page.getByRole("button", { name: "Open menu" });
              await trigger.click();
              const opened = await page.getByRole("dialog", { name: "Main navigation" }).isVisible();
              await page.keyboard.press("Escape");
              const closed = !(await page.getByRole("dialog", { name: "Main navigation" }).isVisible().catch(() => false));
              const focusRestored = await trigger.evaluate((el) => document.activeElement === el);
              menu = { opened, escapeClosed: closed, focusRestored };
            }

            await page.screenshot({ path: `verification/screenshots/${viewport.name}-light.png`, fullPage: true });
            results.push({ viewport, audit, menu, pageErrors });
            await page.close();
          }

          for (const viewport of [{ name: "390x844", width: 390, height: 844 }, { name: "1440x1000", width: 1440, height: 1000 }]) {
            const page = await browser.newPage({ viewport: { width: viewport.width, height: viewport.height }, colorScheme: "dark" });
            await page.goto("http://127.0.0.1:3000/", { waitUntil: "networkidle" });
            await page.screenshot({ path: `verification/screenshots/${viewport.name}-dark.png`, fullPage: true });
            await page.close();
          }

          await writeFile("verification/headless-audit.json", JSON.stringify(results, null, 2));
          await browser.close();
          EOF

          cat > verification/lighthouse-summary.mjs <<'EOF'
          import { readFile, writeFile } from "node:fs/promises";

          const median = (values) => {
            const sorted = values.filter((value) => Number.isFinite(value)).sort((a, b) => a - b);
            if (!sorted.length) return null;
            return sorted[Math.floor(sorted.length / 2)];
          };

          const labels = ["base", "landing"];
          const summary = {};
          for (const label of labels) {
            const runs = [];
            for (let i = 1; i <= 3; i += 1) {
              const report = JSON.parse(await readFile(`verification/${label}-lh-${i}.json`, "utf8"));
              const requests = report.audits?.["network-requests"]?.details?.items ?? [];
              const transfer = (type) => requests.filter((item) => !type || item.resourceType === type).reduce((sum, item) => sum + (item.transferSize || 0), 0);
              runs.push({
                lcp: report.audits?.["largest-contentful-paint"]?.numericValue,
                cls: report.audits?.["cumulative-layout-shift"]?.numericValue,
                fcp: report.audits?.["first-contentful-paint"]?.numericValue,
                tbt: report.audits?.["total-blocking-time"]?.numericValue,
                speedIndex: report.audits?.["speed-index"]?.numericValue,
                performance: (report.categories?.performance?.score ?? 0) * 100,
                accessibility: (report.categories?.accessibility?.score ?? 0) * 100,
                bestPractices: (report.categories?.["best-practices"]?.score ?? 0) * 100,
                seo: (report.categories?.seo?.score ?? 0) * 100,
                totalTransfer: transfer(),
                jsTransfer: transfer("Script"),
                imageTransfer: transfer("Image"),
                requestCount: requests.length,
                images: requests.filter((item) => item.resourceType === "Image").map((item) => ({ url: item.url, transferSize: item.transferSize || 0 }))
              });
            }
            summary[label] = {
              runs,
              median: Object.fromEntries(Object.keys(runs[0]).filter((key) => key !== "images").map((key) => [key, median(runs.map((run) => run[key]))])),
              imageRequests: runs[1].images
            };
          }
          await writeFile("verification/lighthouse-summary.json", JSON.stringify(summary, null, 2));
          console.log(JSON.stringify(summary, null, 2));
          EOF

      - name: Start BASE and collect 3-run Lighthouse
        shell: bash
        run: |
          set -e
          cd /tmp/mb-base
          ./node_modules/.bin/next start -H 127.0.0.1 -p 3000 > "$GITHUB_WORKSPACE/verification/base-server.log" 2>&1 &
          pid=$!
          echo "$pid" > "$GITHUB_WORKSPACE/verification/base-server.pid"
          for i in {1..60}; do curl -fsS http://127.0.0.1:3000/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:3000/ > "$GITHUB_WORKSPACE/verification/base-ssr.html"
          cd "$GITHUB_WORKSPACE"
          for i in 1 2 3; do
            npx -y lighthouse@12 http://127.0.0.1:3000/ --quiet --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path="verification/base-lh-$i.json"
          done
          kill "$pid" || true

      - name: Start LANDING and collect headless proof plus 3-run Lighthouse
        shell: bash
        run: |
          set -e
          ./node_modules/.bin/next start -H 127.0.0.1 -p 3000 > verification/landing-server.log 2>&1 &
          pid=$!
          echo "$pid" > verification/landing-server.pid
          for i in {1..60}; do curl -fsS http://127.0.0.1:3000/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:3000/ > verification/landing-ssr.html
          node verification/landing-headless.mjs
          for i in 1 2 3; do
            npx -y lighthouse@12 http://127.0.0.1:3000/ --quiet --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path="verification/landing-lh-$i.json"
          done
          kill "$pid" || true
          node verification/lighthouse-summary.mjs | tee verification/lighthouse-summary.log

      - name: Prove server-rendered landing content exists before hydration
        shell: bash
        run: |
          grep -q "When your Muddies are close" verification/landing-ssr.html
          grep -q "Muddies + Linkr" verification/landing-ssr.html
          grep -q "Privacy" verification/landing-ssr.html
          printf 'landing body text in raw HTML = PASS\ndesktop navigation text in raw HTML = PASS\n' | tee verification/ssr-proof.txt

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-final-verification-${{ github.sha }}
          path: verification/
          if-no-files-found: warn

      - name: Enforce landing full-suite result
        if: always()
        shell: bash
        run: |
          base_status=$(cat verification/base-vitest.status 2>/dev/null || echo 99)
          landing_status=$(cat verification/landing-vitest.status 2>/dev/null || echo 99)
          echo "BASE vitest exit=$base_status"
          echo "LANDING vitest exit=$landing_status"
          test "$landing_status" -eq 0
