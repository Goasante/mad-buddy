name: PR43 last test diagnostic

on:
  push:
    branches:
      - fix/event-room-qr-attachments-mobile-shell

jobs:
  test-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture unit test output
        shell: bash
        run: |
          set +e
          npm test > test-output.txt 2>&1
          status=$?
          echo "$status" > test-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pr43-last-test-output
          path: |
            test-output.txt
            test-status.txt
          retention-days: 1
